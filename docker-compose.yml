services:
  mongo:
    image: mongo:8.0.4
    container_name: basketlens-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - basketlens-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cassandra:
    image: cassandra:5.0.2
    container_name: basketlens-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "BasketLensCluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      MAX_HEAP_SIZE: "1536M"
      HEAP_NEWSIZE: "384M"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - basketlens-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  redis:
    image: redis:7.4.2-alpine
    container_name: basketlens-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - basketlens-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: basketlens-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: "mongo"
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/"
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_BASICAUTH_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - basketlens-net

  cassandra-web:
    image: dcagatay/cassandra-web:0.5.0
    container_name: basketlens-cassandra-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CASSANDRA_HOST: "cassandra"
      CASSANDRA_HOST_IP: "cassandra"
      CASSANDRA_PORT: "9042"
    entrypoint:
      - /bin/sh
      - -c
      - |
        grep -q "picker.when('5.')" /usr/local/bundle/gems/cassandra-driver-3.2.5/lib/cassandra/driver.rb || sed -i "s/picker.when('4.') do/picker.when('5.') do\n        Cluster::Schema::Fetchers::V3_0_x.new(schema_cql_type_parser, cluster_schema)\n      end\n      picker.when('4.') do/" /usr/local/bundle/gems/cassandra-driver-3.2.5/lib/cassandra/driver.rb
        exec cassandra-web --hosts "`getent hosts cassandra | cut -d' ' -f1 | head -n 1`" --port 9042 --username cassandra --password cassandra
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - basketlens-net

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: basketlens-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - basketlens-net

volumes:
  mongo_data:
  cassandra_data:
  redis_data:

networks:
  basketlens-net:
    driver: bridge
