<svg xmlns="http://www.w3.org/2000/svg" width="1440px" height="900px" viewBox="0 0 1440 900" content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram name=&quot;Dualidade Operacional: Modo A (Batch 711 Dias) vs. Modo B (Event Replay Dia a Dia)&quot; id=&quot;diagram-1&quot;&gt;&lt;mxGraphModel dx=&quot;1299&quot; dy=&quot;650&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;1440&quot; pageHeight=&quot;900&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
<defs>
  <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">  <polygon points="0 0, 8 3.5, 0 7" fill="#FBBF24"/></marker><marker id="arr-mongo" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">  <polygon points="0 0, 8 3.5, 0 7" fill="#00ED64"/></marker><marker id="arr-cassandra" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">  <polygon points="0 0, 8 3.5, 0 7" fill="#38BDF8"/></marker><marker id="arr-redis" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">  <polygon points="0 0, 8 3.5, 0 7" fill="#FF4438"/></marker><marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">  <polygon points="0 0, 8 3.5, 0 7" fill="#94A3B8"/></marker><marker id="arr-white" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">  <polygon points="0 0, 8 3.5, 0 7" fill="#F8FAFC"/></marker><linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">  <stop offset="0%" stop-color="#0B1120"/>  <stop offset="50%" stop-color="#111827"/>  <stop offset="100%" stop-color="#1E293B"/></linearGradient>
</defs>
<g id="canvas-content">
<rect width="1440" height="900" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.8"/><rect x="0" y="0" width="1440" height="64" rx="18" fill="#0F172A" fill-opacity="0.92"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#334155" stroke-width="1.5"/><g transform="translate(36, 32)">  <circle cx="0" cy="0" r="16" fill="#0F172A" stroke="#475569" stroke-width="1.8"/>  <path d="M -11 -8 A 13 13 0 0 1 11 -8" fill="none" stroke="#00ED64" stroke-width="3" stroke-linecap="round"/>  <path d="M 13 -3 A 13 13 0 0 1 3 13" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>  <path d="M -3 13 A 13 13 0 0 1 -13 -3" fill="none" stroke="#FF4438" stroke-width="3" stroke-linecap="round"/></g><text x="64" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18px" font-weight="800">Basket<tspan fill="#38BDF8">Lens</tspan><tspan fill="#00ED64" font-size="14px"> 360º</tspan> — Dualidade Operacional: Modo A (Batch 711 Dias) vs. Modo B (Event Replay Dia a Dia)</text><text x="64" y="50" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12px">Solução para o desafio de datasets fechados: demonstração dinâmica de TTL, rotação $slice: -5 e ciclo Cache-Aside</text><rect x="24" y="78" width="1392" height="190" rx="14" fill="#111827" fill-opacity="0.75" stroke="#334155" stroke-width="1.4"/><path d="M 24 92 C 24 84 30 78 38 78 L 1402 78 C 1410 78 1416 84 1416 92 L 1416 114 L 24 114 Z" fill="#1E293B"/><line x1="24" y1="114" x2="1416" y2="114" stroke="#334155" stroke-width="1"/><text x="40" y="101" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13px" font-weight="700">1. Comparativo dos Modos Operacionais (Cold Path vs. Hot Path)</text><rect x="36" y="126" width="672" height="126" rx="10" fill="#3B2205" fill-opacity="0.9" stroke="#FBBF24" stroke-width="1.4"/><text x="50.0" y="148.0" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Modo A — Carga Histórica Completa (Batch)</text><rect x="582.8" y="134.0" width="111.2" height="18" rx="4" fill="#0F172A" stroke="#FBBF24" stroke-width="1"/><text x="638.4" y="146.5" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Cutoff Day = 711</text><text x="48.0" y="170.0" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11.8px">• Processamento dos 2 anos completos (DAY 1..711 · 102 semanas) via Polars streaming.</text><text x="48.0" y="187.5" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• MongoDB: Carga em lotes de 2.500 domicílios (801 c/ demografia, 1.699 sem) + RFM consolidado.</text><text x="48.0" y="205.0" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Cassandra: Ingestão paralela nas 4 tabelas CQL (transactions, products, sales_week, causal_data).</text><text x="48.0" y="222.5" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Redis: Posiciona o estado ativo em REFERENCE_DAY = 650 (5 campanhas vigentes, rankings semana 94).</text><rect x="732" y="126" width="672" height="126" rx="10" fill="#062E23" fill-opacity="0.9" stroke="#00ED64" stroke-width="1.4"/><text x="746.0" y="148.0" fill="#00ED64" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Modo B — Operação Contínua / Event Replay</text><rect x="1291.2" y="134.0" width="98.8" height="18" rx="4" fill="#0F172A" stroke="#00ED64" stroke-width="1"/><text x="1340.6" y="146.5" fill="#00ED64" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">DAY 650 .. 657</text><text x="744.0" y="170.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Checkpoint de Véspera: prepare_replay_baseline(cutoff_day=649) posiciona os 3 bancos no Dia 649.</text><text x="744.0" y="187.5" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Relógio Acelerado: Cada dia simulado dura SECONDS_PER_DAY = 5 segundos (proporcionalidade TTL).</text><text x="744.0" y="205.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Filtro Seletivo: A cada dia D, lê exclusivamente pl.scan_csv().filter(DAY == D) (~3.600 linhas/dia).</text><text x="744.0" y="222.5" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Checkout Real: Demonstra compra física, resgate de cupom, rotação $slice: -5 e invalidação de cache.</text><rect x="24" y="284" width="1392" height="240" rx="14" fill="#111827" fill-opacity="0.75" stroke="#334155" stroke-width="1.4"/><path d="M 24 298 C 24 290 30 284 38 284 L 1402 284 C 1410 284 1416 290 1416 298 L 1416 320 L 24 320 Z" fill="#1E293B"/><line x1="24" y1="320" x2="1416" y2="320" stroke="#334155" stroke-width="1"/><text x="40" y="307" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13px" font-weight="700">2. Máquina de Estados Diária do Modo B — 4 Passos Coordenados a Cada Dia D</text><rect x="36" y="332" width="320" height="175" rx="10" fill="#450A0A" fill-opacity="0.9" stroke="#FF4438" stroke-width="1.4"/><text x="48.0" y="351.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="12px" font-weight="800">PASSO 1 — Redis</text><rect x="48.0" y="358.0" width="108.6" height="15" rx="3" fill="#0F172A" stroke="#FF4438" stroke-width="0.9"/><text x="102.3" y="369.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="8.8px" font-weight="700" text-anchor="middle">Vigência &amp; Cupons</text><text x="48.0" y="386.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Recalcula TTL das campanhas ativas:</text><text x="48.0" y="403.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">  TTL = max(1, (END_DAY - D) * 5s)</text><text x="48.0" y="421.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">• Expira campanhas com END_DAY &lt; D</text><text x="48.0" y="438.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Resgates: SREM household:{id}:coupons</text><text x="48.0" y="456.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">  + SADD household:{id}:redeemed_coupons</text><rect x="380" y="332" width="320" height="175" rx="10" fill="#082F49" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.4"/><text x="392.0" y="351.0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12px" font-weight="800">PASSO 2 — Cassandra</text><rect x="392.0" y="358.0" width="68.0" height="15" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="0.9"/><text x="426.0" y="369.0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="8.8px" font-weight="700" text-anchor="middle">Séries PDV</text><text x="392.0" y="386.0" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">• Prepared Statements c/ UNLOGGED BATCH</text><text x="392.0" y="403.5" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">• INSERT em transactions_by_household</text><text x="392.0" y="421.0" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">• INSERT em transactions_by_household_product</text><text x="392.0" y="438.5" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">• Atualiza agregados em sales_by_product_week</text><text x="392.0" y="456.0" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">• Leituras O(1) imediatas sem full-scan</text><rect x="724" y="332" width="320" height="175" rx="10" fill="#062E23" fill-opacity="0.9" stroke="#00ED64" stroke-width="1.4"/><text x="736.0" y="351.0" fill="#00ED64" font-family="system-ui, sans-serif" font-size="12px" font-weight="800">PASSO 3 — MongoDB</text><rect x="736.0" y="358.0" width="73.8" height="15" rx="3" fill="#0F172A" stroke="#00ED64" stroke-width="0.9"/><text x="772.9" y="369.0" fill="#00ED64" font-family="system-ui, sans-serif" font-size="8.8px" font-weight="700" text-anchor="middle">Perfil 360º</text><text x="736.0" y="386.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• UpdateOne atômico por cliente comprador:</text><text x="736.0" y="403.5" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• $inc: total_spend e total_baskets</text><text x="736.0" y="421.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• $set: last_day = D</text><text x="736.0" y="438.5" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• $push em recent_baskets com $slice: -5</text><text x="736.0" y="456.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px">  (descarta a cesta mais antiga!)</text><rect x="1068" y="332" width="320" height="175" rx="10" fill="#450A0A" fill-opacity="0.9" stroke="#FF4438" stroke-width="1.4"/><text x="1080.0" y="351.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="12px" font-weight="800">PASSO 4 — Redis</text><rect x="1080.0" y="358.0" width="108.6" height="15" rx="3" fill="#0F172A" stroke="#FF4438" stroke-width="0.9"/><text x="1134.3" y="369.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="8.8px" font-weight="700" text-anchor="middle">Invalidação Ativa</text><text x="1080.0" y="386.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Padrão Write-Invalidate:</text><text x="1080.0" y="403.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">  DEL profile:{household_key}</text><text x="1080.0" y="421.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">  para clientes que compraram no dia D</text><text x="1080.0" y="438.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">• Próxima consulta gera Cache Miss,</text><text x="1080.0" y="456.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">  lê novo estado e repopula SETEX 60s</text><line x1="356.0" y1="420.0" x2="380.0" y2="420.0" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arr-cassandra)"/><rect x="344.0" y="411.0" width="48.0" height="16" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="0.9"/><text x="368.0" y="423.0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">1 -&gt; 2</text><line x1="700.0" y1="420.0" x2="724.0" y2="420.0" stroke="#00ED64" stroke-width="1.8" marker-end="url(#arr-mongo)"/><rect x="688.0" y="411.0" width="48.0" height="16" rx="4" fill="#0F172A" stroke="#00ED64" stroke-width="0.9"/><text x="712.0" y="423.0" fill="#00ED64" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">2 -&gt; 3</text><line x1="1044.0" y1="420.0" x2="1068.0" y2="420.0" stroke="#FF4438" stroke-width="1.8" marker-end="url(#arr-redis)" stroke-dasharray="4 3"/><rect x="1032.0" y="411.0" width="48.0" height="16" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="0.9"/><text x="1056.0" y="423.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">3 -&gt; 4</text><rect x="24" y="540" width="1392" height="335" rx="14" fill="#111827" fill-opacity="0.75" stroke="#334155" stroke-width="1.4"/><path d="M 24 554 C 24 546 30 540 38 540 L 1402 540 C 1410 540 1416 546 1416 554 L 1416 576 L 24 576 Z" fill="#1E293B"/><line x1="24" y1="576" x2="1416" y2="576" stroke="#334155" stroke-width="1"/><text x="40" y="563" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13px" font-weight="700">3. Ciclo Cache-Aside e Linha do Tempo Empírica de John Smith (#208)</text><rect x="36" y="586" width="420" height="272" rx="10" fill="#450A0A" fill-opacity="0.9" stroke="#FF4438" stroke-width="1.4"/><text x="50.0" y="608.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Ciclo Cache-Aside (build_360_view)</text><rect x="361.8" y="594.0" width="80.2" height="18" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="1"/><text x="401.9" y="606.5" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Performance</text><text x="48.0" y="630.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">1. Aplicação executa GET profile:208 no Redis:</text><text x="48.0" y="647.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">   • CACHE HIT: Retorna JSON em ~0.35 ms (source=&#x27;redis&#x27;, speedup ~6.8x).</text><text x="48.0" y="665.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">   • CACHE MISS: Consulta MongoDB via EXPRESS_IXSCAN (0 ms) e executa</text><text x="48.0" y="682.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">     SETEX profile:208 60 &lt;json&gt; mantendo aquecido por 60s.</text><text x="48.0" y="700.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">2. Escrita no Replay Diário (quando John Smith compra):</text><text x="48.0" y="717.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">   • Invalidação imediata DEL profile:208 elimina cache prévio.</text><text x="48.0" y="735.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">   • Próxima consulta lê dados novos com $slice: -5 e novo last_day.</text><text x="48.0" y="752.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">3. Garantia de Consistência: TTL 60s contra drift e invalidação ativa no checkout.</text><rect x="476" y="586" width="928" height="62" rx="10" fill="#1E293B" fill-opacity="0.9" stroke="#475569" stroke-width="1.4"/><text x="490.0" y="608.0" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Baseline (Dia 649)</text><rect x="1334.6" y="594.0" width="55.4" height="18" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1"/><text x="1362.3" y="606.5" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Véspera</text><text x="488.0" y="630.0" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• last_day: 647 | total_baskets: 121 | total_spend: $3,877.19</text><text x="488.0" y="647.5" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• 5 cestas em recent_baskets: [..., 41338015594, 41439808495] | Campanha 22 TTL = 35s</text><rect x="476" y="656" width="928" height="62" rx="10" fill="#082F49" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.4"/><text x="490.0" y="678.0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Dia 650 (Replay)</text><rect x="1285.0" y="664.0" width="105.0" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/><text x="1337.5" y="676.5" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Compra s/ Cupom</text><text x="488.0" y="700.0" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Cesta 41466570461 (11 itens, $19.16) · DEL profile:208 executado</text><text x="488.0" y="717.5" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• MongoDB: last_day avança para 650 | total_spend = $3,896.35 | Campanha 22 TTL = 28s</text><rect x="476" y="726" width="928" height="62" rx="10" fill="#062E23" fill-opacity="0.9" stroke="#00ED64" stroke-width="1.4"/><text x="490.0" y="748.0" fill="#00ED64" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Dia 654 (Marco Crítico)</text><rect x="1223.0" y="734.0" width="167.0" height="18" rx="4" fill="#0F172A" stroke="#00ED64" stroke-width="1"/><text x="1306.5" y="746.5" fill="#00ED64" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Resgate Cupom 51800000050</text><text x="488.0" y="770.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px">• Cesta 41531980403 (13 itens, $41.88) contendo SKU 1017772 · Desconto -$1.00</text><text x="488.0" y="787.5" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Redis: SREM cupom + SADD redeemed_coupons | DEL profile:208 | Mongo: $slice: -5</text><rect x="476" y="796" width="928" height="62" rx="10" fill="#450A0A" fill-opacity="0.9" stroke="#FF4438" stroke-width="1.4"/><text x="490.0" y="818.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Dia 657 (Encerramento)</text><rect x="1297.4" y="804.0" width="92.6" height="18" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="1"/><text x="1343.7" y="816.5" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Expiração TTL</text><text x="488.0" y="840.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Campanha 22 tinha vigência até END_DAY = 656 · No Dia 657: TTL = -2 (expirou sozinha!)</text><text x="488.0" y="857.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">• get_active_campaigns(208) retorna 0 campanhas ativas no checkout</text>
</g>
</svg>
