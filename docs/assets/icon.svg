<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00ED64" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <g transform="translate(118, 118)">
    <!-- 360° Segmented Outer Lens Ring -->
    <path d="M -82 -47 A 95 95 0 0 1 75 -58" fill="none" stroke="#00ED64" stroke-width="7" stroke-linecap="round"/>
    <path d="M 86 -40 A 95 95 0 0 1 12 94" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
    <path d="M -12 94 A 95 95 0 0 1 -88 -30" fill="none" stroke="#FF4438" stroke-width="7" stroke-linecap="round"/>

    <!-- Magnifying Lens Rim & Glass -->
    <circle cx="0" cy="0" r="76" fill="url(#lensGlass)" stroke="#94A3B8" stroke-width="2.5"/>
    <line x1="55" y1="55" x2="88" y2="88" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="88" y2="88" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- 1. Cassandra Orbital Ring & Eye -->
    <g transform="rotate(-22)">
      <ellipse cx="0" cy="-6" rx="68" ry="22" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-dasharray="6 3"/>
      <circle cx="-68" cy="-6" r="4.5" fill="#38BDF8"/>
      <circle cx="68" cy="-6" r="4.5" fill="#38BDF8"/>
    </g>
    <g transform="translate(0, -34)">
      <path d="M -22 0 Q 0 -17 22 0 Q 0 17 -22 0 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
      <circle cx="0" cy="0" r="7.5" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="3" fill="#0F172A"/>
      <circle cx="2.5" cy="-2.5" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- 2. MongoDB Leaf -->
    <g transform="translate(-34, -12) rotate(-14)">
      <path d="M 0 -24 C -15 -12 -16 8 0 20 Z" fill="#00ED64"/>
      <path d="M 0 -24 C 15 -12 16 8 0 20 Z" fill="#13AA52"/>
      <line x1="0" y1="-20" x2="0" y2="26" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 3. Redis Stacked 3D Isometric Cubes -->
    <g transform="translate(33, -18)">
      <polygon points="0,16 18,24 0,32 -18,24" fill="#B91C1C"/>
      <polygon points="-18,24 0,32 0,39 -18,31" fill="#991B1B"/>
      <polygon points="18,24 0,32 0,39 18,31" fill="#7F1D1D"/>
      <polygon points="0,5 18,13 0,21 -18,13" fill="#DC382D"/>
      <polygon points="-18,13 0,21 0,28 -18,20" fill="#B91C1C"/>
      <polygon points="18,13 0,21 0,28 18,20" fill="#991B1B"/>
      <polygon points="0,-6 18,2 0,10 -18,2" fill="#FF4438"/>
      <polygon points="-18,2 0,10 0,17 -18,9" fill="#DC382D"/>
      <polygon points="18,2 0,10 0,17 18,9" fill="#B91C1C"/>
      <polygon points="0,-2 6,2 0,6 -6,2" fill="#FEE2E2"/>
    </g>

    <!-- 4. Retail Shopping Basket -->
    <path d="M -28 2 L -14 -16 M 28 2 L 14 -16" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="-52" y="2" width="104" height="9" rx="4.5" fill="#F8FAFC"/>
    <path d="M -44 11 L -33 50 Q -31 56 -24 56 L 24 56 Q 31 56 33 50 L 44 11 Z"
          fill="#0F172A" fill-opacity="0.72" stroke="#F8FAFC" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="-22" y1="18" x2="-17" y2="49" stroke="#00ED64" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="49" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="18" x2="17" y2="49" stroke="#FF4438" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-36" y1="34" x2="36" y2="34" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>
