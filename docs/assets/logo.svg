<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00ED64" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="820" height="260" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- ==================== LEFT: 360° POLYGLOT BASKET EMBLEM ==================== -->
  <g transform="translate(140, 128)">
    <!-- 360° Segmented Outer Lens Ring (Mongo Green, Cassandra Cyan, Redis Red) -->
    <!-- MongoDB Arc (Top-Left) -->
    <path d="M -82 -47 A 95 95 0 0 1 75 -58" fill="none" stroke="#00ED64" stroke-width="7" stroke-linecap="round"/>
    <!-- Cassandra Arc (Right) -->
    <path d="M 86 -40 A 95 95 0 0 1 12 94" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>
    <!-- Redis Arc (Bottom-Left) -->
    <path d="M -12 94 A 95 95 0 0 1 -88 -30" fill="none" stroke="#FF4438" stroke-width="7" stroke-linecap="round"/>

    <!-- Magnifying Lens Rim & Glass -->
    <circle cx="0" cy="0" r="76" fill="url(#lensGlass)" stroke="#94A3B8" stroke-width="2.5"/>
    <!-- Magnifying Lens Handle (Bottom-Right) -->
    <line x1="55" y1="55" x2="88" y2="88" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>
    <line x1="55" y1="55" x2="88" y2="88" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- 1. CASSANDRA ORBITAL RING & EYE (Behind/Around the Basket) -->
    <g transform="rotate(-22)">
      <ellipse cx="0" cy="-6" rx="68" ry="22" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-dasharray="6 3"/>
      <circle cx="-68" cy="-6" r="4.5" fill="#38BDF8"/>
      <circle cx="68" cy="-6" r="4.5" fill="#38BDF8"/>
    </g>
    <!-- Cassandra Eye at Top Center of Basket -->
    <g transform="translate(0, -34)">
      <path d="M -22 0 Q 0 -17 22 0 Q 0 17 -22 0 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
      <circle cx="0" cy="0" r="7.5" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="3" fill="#0F172A"/>
      <circle cx="2.5" cy="-2.5" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- 2. MONGODB LEAF (Left side inside Basket) -->
    <g transform="translate(-34, -12) rotate(-14)">
      <!-- Left half of leaf -->
      <path d="M 0 -24 C -15 -12 -16 8 0 20 Z" fill="#00ED64"/>
      <!-- Right half of leaf -->
      <path d="M 0 -24 C 15 -12 16 8 0 20 Z" fill="#13AA52"/>
      <!-- Stem & central vein -->
      <line x1="0" y1="-20" x2="0" y2="26" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 3. REDIS STACKED 3D ISOMETRIC CUBES (Right side inside Basket) -->
    <g transform="translate(33, -18)">
      <!-- Bottom Cube Slice -->
      <polygon points="0,16 18,24 0,32 -18,24" fill="#B91C1C"/>
      <polygon points="-18,24 0,32 0,39 -18,31" fill="#991B1B"/>
      <polygon points="18,24 0,32 0,39 18,31" fill="#7F1D1D"/>
      <!-- Middle Cube Slice -->
      <polygon points="0,5 18,13 0,21 -18,13" fill="#DC382D"/>
      <polygon points="-18,13 0,21 0,28 -18,20" fill="#B91C1C"/>
      <polygon points="18,13 0,21 0,28 18,20" fill="#991B1B"/>
      <!-- Top Cube Slice + White Geometric Star/Diamond -->
      <polygon points="0,-6 18,2 0,10 -18,2" fill="#FF4438"/>
      <polygon points="-18,2 0,10 0,17 -18,9" fill="#DC382D"/>
      <polygon points="18,2 0,10 0,17 18,9" fill="#B91C1C"/>
      <polygon points="0,-2 6,2 0,6 -6,2" fill="#FEE2E2"/>
    </g>

    <!-- 4. RETAIL SHOPPING BASKET (Foreground Frame Holding the 3 DBs) -->
    <!-- Basket Handles -->
    <path d="M -28 2 L -14 -16 M 28 2 L 14 -16" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Basket Top Rim -->
    <rect x="-52" y="2" width="104" height="9" rx="4.5" fill="#F8FAFC"/>
    <!-- Basket Wire Body -->
    <path d="M -44 11 L -33 50 Q -31 56 -24 56 L 24 56 Q 31 56 33 50 L 44 11 Z"
          fill="#0F172A" fill-opacity="0.72" stroke="#F8FAFC" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Basket Vertical Wire Ribs (Colored by DB!) -->
    <line x1="-22" y1="18" x2="-17" y2="49" stroke="#00ED64" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="49" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="18" x2="17" y2="49" stroke="#FF4438" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Basket Horizontal Wire Crossbar -->
    <line x1="-36" y1="34" x2="36" y2="34" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- ==================== RIGHT: WORDMARK & 3 DB PILL BADGES ==================== -->
  <g transform="translate(275, 0)">
    <!-- Eyebrow Label -->
    <text x="0" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="10" font-weight="900" fill="#94A3B8" letter-spacing="2.5">
      BIG DATA &amp; NOSQL · The Complete Journey (dunnhumby)
    </text>

    <!-- Main Title: BasketLens -->
    <text x="0" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      Basket<tspan fill="#38BDF8">Lens</tspan><tspan font-size="24" fill="#00ED64" dy="-22"> 360º</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="16" font-weight="400" fill="#CBD5E1">
      Polyglot Customer Intelligence for Physical Retail
    </text>

    <!-- 3 Database Badges with Native Icons -->
    <!-- Badge 1: MongoDB -->
    <g transform="translate(0, 178)">
      <rect width="156" height="42" rx="10" fill="#064E3B" fill-opacity="0.55" stroke="#00ED64" stroke-width="1.5"/>
      <!-- Mini Mongo Leaf -->
      <path d="M 22 10 C 15 16 15 26 22 32 C 29 26 29 16 22 10 Z" fill="#00ED64"/>
      <line x1="22" y1="12" x2="22" y2="35" stroke="#064E3B" stroke-width="1.5"/>
      <text x="38" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">MongoDB</text>
      <text x="38" y="34" font-family="monospace" font-size="10" fill="#6EE7B7">Document · Profile</text>
    </g>

    <!-- Badge 2: Apache Cassandra -->
    <g transform="translate(170, 178)">
      <rect width="172" height="42" rx="10" fill="#0C4A6E" fill-opacity="0.55" stroke="#38BDF8" stroke-width="1.5"/>
      <!-- Mini Cassandra Eye -->
      <path d="M 12 21 Q 23 12 34 21 Q 23 30 12 21 Z" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="23" cy="21" r="4" fill="#38BDF8"/>
      <text x="42" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Cassandra</text>
      <text x="42" y="34" font-family="monospace" font-size="10" fill="#7DD3FC">Columnar · Baskets</text>
    </g>

    <!-- Badge 3: Redis -->
    <g transform="translate(356, 178)">
      <rect width="154" height="42" rx="10" fill="#7F1D1D" fill-opacity="0.55" stroke="#FF4438" stroke-width="1.5"/>
      <!-- Mini Redis Cubes -->
      <polygon points="23,11 33,16 23,21 13,16" fill="#FF4438"/>
      <polygon points="13,20 23,25 33,20 33,24 23,29 13,24" fill="#DC382D"/>
      <polygon points="13,26 23,31 33,26 33,30 23,35 13,30" fill="#991B1B"/>
      <text x="42" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Redis</text>
      <text x="42" y="34" font-family="monospace" font-size="10" fill="#FCA5A5">Key-Value · TTL</text>
    </g>
  </g>
</svg>
