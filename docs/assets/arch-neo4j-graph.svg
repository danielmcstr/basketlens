<rect width="1440" height="900" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.8"/><rect x="0" y="0" width="1440" height="64" rx="18" fill="#0F172A" fill-opacity="0.92"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#334155" stroke-width="1.5"/><g transform="translate(36, 32)">  <circle cx="0" cy="0" r="16" fill="#0F172A" stroke="#475569" stroke-width="1.8"/>  <path d="M -11 -8 A 13 13 0 0 1 11 -8" fill="none" stroke="#00ED64" stroke-width="3" stroke-linecap="round"/>  <path d="M 13 -3 A 13 13 0 0 1 3 13" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>  <path d="M -3 13 A 13 13 0 0 1 -13 -3" fill="none" stroke="#FF4438" stroke-width="3" stroke-linecap="round"/></g><text x="64" y="30" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18px" font-weight="800">Basket<tspan fill="#38BDF8">Lens</tspan><tspan fill="#00ED64" font-size="14px"> 360º</tspan> — Análise Crítica: Onde Entraria um Banco de Grafos (Neo4j Property Graph)?</text><text x="64" y="50" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12px">Topologia de Grafo de Propriedades para Recomendação Multi-Salto, Atribuição Fim-a-Fim e Comunidades Lookalike</text><rect x="24" y="78" width="880" height="525" rx="14" fill="#111827" fill-opacity="0.75" stroke="#334155" stroke-width="1.4"/><path d="M 24 92 C 24 84 30 78 38 78 L 890 78 C 898 78 904 84 904 92 L 904 114 L 24 114 Z" fill="#1E293B"/><line x1="24" y1="114" x2="904" y2="114" stroke="#334155" stroke-width="1"/><text x="40" y="101" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13px" font-weight="700">1. Topologia do Grafo de Propriedades no Neo4j</text><circle cx="130" cy="200" r="52" fill="#064E3B" stroke="#00ED64" stroke-width="2"/><text x="130" y="197" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" text-anchor="middle">(:Household)</text><text x="130" y="215" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10px" text-anchor="middle">key: 208 · Age4</text><circle cx="130" cy="420" r="52" fill="#064E3B" stroke="#00ED64" stroke-width="2"/><text x="130" y="417" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" text-anchor="middle">(:Household)</text><text x="130" y="435" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10px" text-anchor="middle">key: 997 · Lookalike</text><circle cx="370" cy="200" r="50" fill="#7F1D1D" stroke="#FF4438" stroke-width="2"/><text x="370" y="197" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" text-anchor="middle">(:Campaign)</text><text x="370" y="215" fill="#FECACA" font-family="system-ui, sans-serif" font-size="10px" text-anchor="middle">id: 22 · TypeB</text><circle cx="590" cy="200" r="50" fill="#7F1D1D" stroke="#FF4438" stroke-width="2"/><text x="590" y="197" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" text-anchor="middle">(:Coupon)</text><text x="590" y="215" fill="#FECACA" font-family="system-ui, sans-serif" font-size="10px" text-anchor="middle">51800000050</text><circle cx="800" cy="200" r="52" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/><text x="800" y="197" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" text-anchor="middle">(:Product)</text><text x="800" y="215" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="10px" text-anchor="middle">id: 1017772</text><circle cx="800" cy="370" r="52" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/><text x="800" y="367" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" text-anchor="middle">(:Product)</text><text x="800" y="385" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="10px" text-anchor="middle">id: 862349 (Milk)</text><circle cx="800" cy="510" r="46" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/><text x="800" y="507" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" text-anchor="middle">(:Commodity)</text><text x="800" y="525" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10px" text-anchor="middle">FLUID MILK</text><line x1="182.0" y1="200.0" x2="320.0" y2="200.0" stroke="#FF4438" stroke-width="1.8" marker-end="url(#arr-redis)"/><rect x="212.0" y="191.0" width="78.0" height="16" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="0.9"/><text x="251.0" y="203.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">[:RECEIVED]</text><line x1="420.0" y1="200.0" x2="540.0" y2="200.0" stroke="#FF4438" stroke-width="1.8" marker-end="url(#arr-redis)"/><rect x="447.0" y="191.0" width="66.0" height="16" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="0.9"/><text x="480.0" y="203.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">[:OFFERS]</text><line x1="640.0" y1="200.0" x2="748.0" y2="200.0" stroke="#FF4438" stroke-width="1.8" marker-end="url(#arr-redis)"/><rect x="652.0" y="191.0" width="84.0" height="16" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="0.9"/><text x="694.0" y="203.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">[:DISCOUNTS]</text><line x1="180.0" y1="230.0" x2="545.0" y2="230.0" stroke="#FF4438" stroke-width="1.8" marker-end="url(#arr-redis)" stroke-dasharray="4 3"/><rect x="290.5" y="221.0" width="144.0" height="16" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="0.9"/><text x="362.5" y="233.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">[:REDEEMED {day: 654}]</text><line x1="182.0" y1="390.0" x2="748.0" y2="230.0" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arr-cassandra)"/><rect x="399.0" y="301.0" width="132.0" height="16" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="0.9"/><text x="465.0" y="313.0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">[:BOUGHT {times: 7}]</text><line x1="182.0" y1="420.0" x2="748.0" y2="370.0" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arr-cassandra)"/><rect x="396.0" y="386.0" width="138.0" height="16" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="0.9"/><text x="465.0" y="398.0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">[:BOUGHT {times: 14}]</text><line x1="800.0" y1="252.0" x2="800.0" y2="318.0" stroke="#00ED64" stroke-width="1.8" marker-end="url(#arr-mongo)"/><rect x="752.0" y="276.0" width="96.0" height="16" rx="4" fill="#0F172A" stroke="#00ED64" stroke-width="0.9"/><text x="800.0" y="288.0" fill="#00ED64" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">[:BOUGHT_WITH]</text><line x1="800.0" y1="422.0" x2="800.0" y2="464.0" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arr-gray)"/><rect x="752.0" y="434.0" width="96.0" height="16" rx="4" fill="#0F172A" stroke="#94A3B8" stroke-width="0.9"/><text x="800.0" y="446.0" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">[:IN_CATEGORY]</text><rect x="920" y="78" width="496" height="525" rx="14" fill="#111827" fill-opacity="0.75" stroke="#334155" stroke-width="1.4"/><path d="M 920 92 C 920 84 926 78 934 78 L 1402 78 C 1410 78 1416 84 1416 92 L 1416 114 L 920 114 Z" fill="#1E293B"/><line x1="920" y1="114" x2="1416" y2="114" stroke="#334155" stroke-width="1"/><text x="936" y="101" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13px" font-weight="700">2. Três Casos de Uso Ideais para Neo4j (Cypher e GDS)</text><rect x="932" y="126" width="472" height="145" rx="10" fill="#062E23" fill-opacity="0.9" stroke="#00ED64" stroke-width="1.4"/><text x="946.0" y="148.0" fill="#00ED64" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">1. Next-Best-Offer e Afinidade de Cesta</text><rect x="1278.8" y="134.0" width="111.2" height="18" rx="4" fill="#0F172A" stroke="#00ED64" stroke-width="1"/><text x="1334.4" y="146.5" fill="#00ED64" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Cypher Multi-Hop</text><text x="944.0" y="170.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Pergunta: Quais SKUs são frequentemente comprados com 1017772</text><text x="944.0" y="187.5" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px">  por famílias do mesmo perfil demográfico que John Smith (Age4),</text><text x="944.0" y="205.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px">  mas que ele ainda não comprou?</text><text x="944.0" y="222.5" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Cypher: MATCH (h:Household {key:208})-[:BOUGHT]-&gt;(p1)-[:BOUGHT_WITH]-&gt;(p2)</text><text x="944.0" y="240.0" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px">  WHERE NOT (h)-[:BOUGHT]-&gt;(p2) RETURN p2.id, count(*) ORDER BY count(*) DESC</text><text x="944.0" y="257.5" fill="#D1FAE5" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• No Cassandra/MongoDB: exigiria múltiplos self-joins lentos em memória.</text><rect x="932" y="284" width="472" height="145" rx="10" fill="#450A0A" fill-opacity="0.9" stroke="#FF4438" stroke-width="1.4"/><text x="946.0" y="306.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">2. Atribuição Fim-a-Fim e Efeito Halo</text><rect x="1291.2" y="292.0" width="98.8" height="18" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="1"/><text x="1340.6" y="304.5" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Caminho Causal</text><text x="944.0" y="328.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Rastreia o caminho causal exato entre incentivo e consumo:</text><text x="944.0" y="345.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">  (:Household)-[:RECEIVED]-&gt;(:Campaign)-[:OFFERS]-&gt;(:Coupon)</text><text x="944.0" y="363.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">  &lt;-[:REDEEMED]-(:Household)-[:BOUGHT]-&gt;(:Product)</text><text x="944.0" y="380.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Mede receita colateral (Halo Effect): produtos adicionados à cesta</text><text x="944.0" y="398.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">  porque o cupom do item 1017772 atraiu o cliente à loja física.</text><rect x="932" y="442" width="472" height="148" rx="10" fill="#082F49" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.4"/><text x="946.0" y="464.0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">3. Comunidades e Lookalike (Graph Data Science)</text><rect x="1291.2" y="450.0" width="98.8" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/><text x="1340.6" y="462.5" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Algoritmos GDS</text><text x="944.0" y="486.0" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Louvain Community Detection: agrupa clientes por similaridade estrutural</text><text x="944.0" y="503.5" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">  de hábitos de compra, sem depender apenas de rótulos demográficos.</text><text x="944.0" y="521.0" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Node Similarity e FastRP: gera embeddings vetoriais para calibrar</text><text x="944.0" y="538.5" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">  o disparo de campanhas personalizadas TypeA com alta conversão.</text><rect x="24" y="620" width="1392" height="255" rx="14" fill="#111827" fill-opacity="0.75" stroke="#334155" stroke-width="1.4"/><path d="M 24 634 C 24 626 30 620 38 620 L 1402 620 C 1410 620 1416 626 1416 634 L 1416 656 L 24 656 Z" fill="#1E293B"/><line x1="24" y1="656" x2="1416" y2="656" stroke="#334155" stroke-width="1"/><text x="40" y="643" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13px" font-weight="700">3. Fronteira Arquitetural: Por que o Neo4j é um Sidecar e NÃO substitui os 3 Bancos nas Perguntas 1, 2 e 3</text><rect x="36" y="668" width="440" height="192" rx="10" fill="#1E293B" fill-opacity="0.9" stroke="#475569" stroke-width="1.4"/><text x="50.0" y="690.0" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Pergunta 1: Lookup + Partição</text><rect x="307.4" y="676.0" width="154.6" height="18" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1"/><text x="384.7" y="688.5" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Q1: MongoDB + Cassandra</text><text x="48.0" y="712.0" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Necessidade: documento coeso 360º + fatia recente ordenada.</text><text x="48.0" y="729.5" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.8px">• MongoDB resolve perfil em 0 ms via EXPRESS_IXSCAN.</text><text x="48.0" y="747.0" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.8px">• Cassandra lê topo de partição em complexidade constante O(1).</text><text x="48.0" y="764.5" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11.8px">• Grafo adicionaria sobrecarga de travessia sem ganho algorítmico.</text><rect x="500" y="668" width="440" height="192" rx="10" fill="#450A0A" fill-opacity="0.9" stroke="#FF4438" stroke-width="1.4"/><text x="514.0" y="690.0" fill="#FF4438" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Pergunta 2: Pertinência + TTL</text><rect x="783.8" y="676.0" width="142.2" height="18" rx="4" fill="#0F172A" stroke="#FF4438" stroke-width="1"/><text x="854.9" y="688.5" fill="#FF4438" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Q2: Redis Speed Layer</text><text x="512.0" y="712.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Necessidade: validar cupons ativos no checkout com latência &lt; 0.5 ms.</text><text x="512.0" y="729.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">• Redis entrega SMEMBERS + expiração por TTL nativo.</text><text x="512.0" y="747.0" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">• Neo4j não possui expiração nativa por chave e exigiria cron jobs.</text><text x="512.0" y="764.5" fill="#FEE2E2" font-family="system-ui, sans-serif" font-size="11.8px">• Redis é incomparavelmente superior para estado efêmero em RAM.</text><rect x="964" y="668" width="440" height="192" rx="10" fill="#082F49" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.4"/><text x="978.0" y="690.0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="13px" font-weight="800">Pergunta 3: Agregação Tabular</text><rect x="1247.8" y="676.0" width="142.2" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/><text x="1318.9" y="688.5" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" text-anchor="middle">Q3: Cassandra + Mongo</text><text x="976.0" y="712.0" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px" font-weight="700">• Necessidade: soma de gastos das 801 famílias demográficas.</text><text x="976.0" y="729.5" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">• Cassandra lê partições concorrentemente e Mongo projeta índices.</text><text x="976.0" y="747.0" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">• Varrer grafos para somas aritméticas massivas é muito mais lento.</text><text x="976.0" y="764.5" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11.8px">• Neo4j entra apenas como sidecar para recomendações multi-salto.</text>
</g>
</svg>
